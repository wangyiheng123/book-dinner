<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <style>
      #system-name{
        border: 1px solid rebeccapurple;
        background-color: deepskyblue;
        float: left;
        width: 200px;
        height: 80px;
      }
      #header-white-space{
        border: 1px solid brown;
        width: 1889px;
        height: 80px;
        background-color: sandybrown;
        text-align: center;
        line-height: 80px;
        font-size: 30px;
      }
      #system-function{
        border: 1px solid black;
        width: 200px;
        height: 875px;
        background-color: gray;
      }
      .function{
        border: 1px solid black;
        cursor: pointer;
      }
      .function:hover{
          background-color: darkgray;
      }
      #system-img img{
          width: 50px;
          height: 50px;
      }
      #system-body{
          width: 1689px;
          height: 875px;
          border: 1px solid red;
          position: relative;
          top: -877px;
          left: 200px;
          background-color: lightskyblue;
      }
      #system-body-container{
          width: 900px;
          height: 874px;
          position: relative;
          left: 430px;
      }
      #system-body-container1{
          width: 900px;
          height: 874px;
          position: relative;
          left: 430px;
          text-align: center;
          line-height: 874px;
          font-weight: bold;
          font-size: 30px;
      }
    </style>
</head>
<body>
  <div id="app">
      <!--首页头部-->
      <div id="index-header">
          <!--首页系统名称-->
          <div id="system-name">
              <div id="system-img" style="display: inline-block;position: relative;top: 15px;left: 20px">
                  <img src="../img/food1.jpg" alt="图片无法显示">
              </div>
              <h1 style="display:inline-block;font-family: '华文新魏',serif;position: relative;left: 18px;background-image: -webkit-linear-gradient(0deg,yellow 33%,red 33%,green);-webkit-background-clip: text;color: transparent">食全食美</h1>
          </div>
          <!--首页留白-->
          <div id="header-white-space">
              欢迎管理员<span style="color: blue">{{name}}</span>登录
          </div>
          <!--首页功能-->
          <div id="system-function">
              <div id="function-index" class="function" @click="jumpIndex">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">首&nbsp;&nbsp;&nbsp;&nbsp;页</h3>
              </div>
              <div id="function-hotPointer" class="function" @click="jumpShop">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">店铺管理</h3>
              </div>
              <div id="function-Rider" class="function" @click="jumpRider">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">骑手管理</h3>
              </div>
              <div id="function-UM" class="function" @click="jumpUM" style="background-color: darkgray">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">用户管理</h3>
              </div>
              <div id="function-User" class="function" @click="jumpUser">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">个人中心</h3>
              </div>
              <div id="leave" class="function" @click="leave">
                  <h3 style="text-align: center;font-family: '华文仿宋',serif">退出系统</h3>
              </div>
          </div>
          <!--首页展示体-->
          <div id="system-body">
               <div v-show="containerShow" id="system-body-container" style="overflow: auto">
                   <div v-for="user in userList">
                       <div style="width: 880px;height: 300px;background-color: deepskyblue;border-radius: 10px;position: relative;top: 15px;margin-bottom: 10px">
                           <div style="width: 50px;height: 50px;border-radius: 50%;border: 1px solid black;position: relative;left: 30px;top: 15px">
                               <img src="/img/riderImage.png" width="50" height="50" style="clip-path: circle(50%)">
                           </div>
                           <div style="width: 200px;height: 35px;line-height: 35px;font-size: 20px;font-weight: bold;position: relative;left: 90px;top: -28px">
                               {{user.name}}&nbsp;&nbsp;&nbsp;&nbsp;<span style="font-size: 18px;font-weight: normal">{{user.age}}岁</span>
                           </div>
                           <div style="width: 350px;height: 30px;line-height: 30px;font-size: 18px;font-weight: bold;position: relative;left: 30px;top: -10px;">
                               电子邮箱：<span style="font-weight: normal;">{{user.email}}</span>
                           </div>
                           <div style="width: 600px;height: 60px;line-height: 30px;font-size: 18px;font-weight: bold;position: relative;left: 30px;top: -5px;">
                               个人爱好：
                               <div style="width: 400px;height: auto;min-height:30px;position: relative;top: -30px;left:90px;word-break: break-all;line-height: 30px;font-weight: normal;">
                                  {{user.likes}}
                               </div>
                           </div>
                           <div style="width: 600px;height: 60px;line-height: 30px;font-size: 18px;font-weight: bold;position: relative;left: 30px;top: 0px;">
                               个性签名：
                               <div style="width: 400px;height: auto;min-height:30px;position: relative;top: -30px;left:90px;word-break: break-all;line-height: 30px;font-weight: normal;">
                                  {{user.content}}
                               </div>
                           </div>
                           <div style="width: 130px;height: 40px;border-radius: 30px;text-align: center;line-height: 40px;background-color: orange;cursor: pointer;position: relative;left: 710px;top: 0px;" @click="updateManage($event)">
                               设为管理
                           </div>
                           <span hidden>{{user.id}}</span>
                       </div>
                   </div>
               </div>
              <div v-show="!containerShow" id="system-body-container1">
                  没有查询到用户信息
              </div>
          </div>
      </div>
  </div>
</body>
<script src="/js/vue.js"></script>
<script src="/js/axios.min.js"></script>
<script>
    let config = {
        headers:{
            token:""
        }
    };
    new Vue({
        el:"#app",
        data:{
            name:"",
            userId:"",
            token:"",
            userList:{

            },
            containerShow:false,
        },
        created(){
            let vthis = this;
            this.name = sessionStorage.getItem("name");
            this.userId = sessionStorage.getItem("userId");
            this.token = sessionStorage.getItem("token");
            config.headers.token = sessionStorage.getItem("token");
            axios.get("/user/findAllUser",config).then(function (result) {
                if (result.data.code === 20061){
                    vthis.containerShow = true;
                    vthis.userList = result.data.data;
                }else {
                    vthis.containerShow = false;
                }
            });
        },
        methods:{
            jumpIndex(){
                window.location.href = "adminIndex.html?token="+this.token;
            },
            jumpShop(){
                window.location.href = "havedShop.html?token="+this.token;
            },
            leave(){
                window.location.href = "login.html";
            },
            jumpRider(){
                window.location.href = "adminRider.html?token="+this.token;
            },
            jumpUser(){
                window.location.href = "adminUser.html?token="+this.token;
            },
            jumpUM(){
                window.location.href = "adminUserManange.html?token="+this.token;
            },
            updateManage(e){
                let vthis = this;
                let flag = window.confirm("确认要将该用户设为管理员吗？");
                if (flag){
                    axios.get("/user/updateUserToManage/"+e.target.nextElementSibling.innerText,config).then(function (result) {
                        if (result.data.code === 20031){
                            alert(result.data.message);
                            vthis.containerShow = true;
                            vthis.userList = result.data.data;
                        }else {
                            alert(result.data.message);
                        }
                    });
                }
            }
        }
    });
</script>
</html>
