<script>
    let config = {
        headers:{
            token:""
        }
    };
    new Vue({
        el:"#app",
        data:{
            name:"",
            userId:"",
            token:""
        },
        created(){
            this.name = sessionStorage.getItem("name");
            this.userId = sessionStorage.getItem("userId");
            this.token = sessionStorage.getItem("token");
            config.headers.token = sessionStorage.getItem("token");
        },
        methods:{
            jumpIndex(){
                window.location.href = "index.html?token="+this.token;
            },
            jumpAdvice(){
                window.location.href = "advice.html?token="+this.token;
            },
            jumpUser(){
                window.location.href = "user.html?token="+this.token;
            },
            jumpAddress(){
                window.location.href = "address.html?token="+this.token;
            },
            jumpOrder(){
                window.location.href = "order.html?token="+this.token;
            },
            leave(){
                window.location.href = "login.html";
            }
        }
    });
</script>
<script>
    let kindData = [];
    let array1 = [];
    let array2 = [];
    let array3 = [];
    let array4 = [];
    let array5 = [];
    let array6 = [];
    let array7 = [];
    let array8 = [];
    axios.get("/kind/findAllKind",config).then(function (result){
        if (result.data.code === 20061){
            kindData = result.data.data;
        }else {
            alert("没有查询到！");
        }
    });
    axios.get("/weekData/findAllWeekData",config).then(function (result){
        array1 = result.data.data.array1;
        array2 = result.data.data.array2;
        array3 = result.data.data.array3;
        array4 = result.data.data.array4;
        array5 = result.data.data.array5;
        array6 = result.data.data.array6;
        array7 = result.data.data.array7;
        array8 = result.data.data.array8;
    });
    setTimeout(function (){
        let canvas = document.getElementsByTagName("canvas")[0];
        if (canvas.getContext){
            let context = canvas.getContext("2d");
            context.fillStyle = "lightskyblue";
            context.fillRect(0,0,canvas.width,canvas.height);
            let data = kindData;
            console.log(data);
            let colors = ["red","orange","yellow","green","blue","purple","aqua","lawngreen"];
            let total = 0;
            for (let i = 0;i < data.length;i++){
                total += data[i];
            }
            let preAngle = 0;
            for (let i = 0;i < data.length;i++){
                let fraction = data[i] / total;
                let angle = preAngle + fraction * Math.PI * 2;
                context.fillStyle = colors[i];
                context.beginPath();
                context.moveTo(150,150);
                context.arc(150,150,100,preAngle,angle);
                context.closePath();
                context.fill();
                context.strokeStyle = "black";
                context.stroke();
                preAngle = angle;
            }
        }
    },1000);
</script>
<script>
    setTimeout(function (){
        let ctx = document.getElementById("barCanvas").getContext("2d");
        //配置柱状图数据
        let barCanvas = new Chart(ctx,{
            type:'bar',
            data: {
                labels:["川菜","鲁菜","粤菜","苏菜","浙菜","闽菜","湘菜","苏菜"], //标题
                datasets:[{
                    label:"月售量",//设置数据标题
                    data:kindData, //设置柱状图Y轴数据
                    backgroundColor:[
                        "red","orange","yellow","green","blue","purple","aqua","lawngreen"
                    ],
                    borderColor:[
                        "red","orange","yellow","green","blue","purple","aqua","lawngreen"
                    ],
                    borderWidth:1 //边框宽度
                }]
            }
        })
    },1500);
</script>
<script>
    function line(lineDOM,data){
        let lineCanvas = lineDOM;
        let option = {
            xAxis:{
                type: 'category',
                data:['周一','周二','周三','周四','周五','周六','周日']
            },
            yAxis:{
                type:'value'
            },
            series:[{
                data:data,
                type:'line'
            }]
        };
        lineCanvas.setOption(option);
    }
    setTimeout(function (){
        line(echarts.init(document.getElementsByClassName("lineCanvas")[0]),array1);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[1]),array2);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[2]),array3);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[3]),array4);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[4]),array5);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[5]),array6);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[6]),array7);
        line(echarts.init(document.getElementsByClassName("lineCanvas")[7]),array8);
    },1500);
</script>
